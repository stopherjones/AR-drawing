<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  :root { --accent:#7dd3fc; --panel:rgba(15,18,25,0.82); --line:rgba(255,255,255,0.12); }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; font-family:system-ui, sans-serif; }
  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #pic { position:absolute; left:50%; top:50%; max-width:none; opacity:0.5; display:none;
         transform-origin:center center; pointer-events:none; }

  #ui { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(94vw, 520px);
        background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid var(--line); border-radius:16px; color:#fff; z-index:2;
        box-shadow:0 10px 30px rgba(0,0,0,0.4); transition:transform .25s ease, opacity .25s ease; }
  #ui.hidden { transform:translate(-50%, calc(100% + 30px)); opacity:0; }

  #toggle { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:3;
            width:48px; height:48px; border-radius:50%; border:1px solid var(--line);
            background:var(--panel); color:#fff; font-size:20px; cursor:pointer; display:none;
            box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  #toggle.show { display:block; }

  .panel-head { display:flex; justify-content:space-between; align-items:center; padding:10px 14px 0; font-size:12px;
                text-transform:uppercase; letter-spacing:.08em; color:#9aa4b2; }
  .panel-body { padding:10px 14px 14px; display:grid; gap:12px; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; }
  .btn { background:rgba(255,255,255,0.08); border:1px solid var(--line); color:#fff; border-radius:10px;
         padding:10px 12px; font:14px system-ui, sans-serif; cursor:pointer; text-align:center; }
  .btn:active { background:rgba(255,255,255,0.18); }
  .btn.primary { background:var(--accent); color:#0b1320; border-color:transparent; font-weight:600; }
  select { background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--line); border-radius:10px;
           padding:10px; font:14px system-ui, sans-serif; }
  select option { color:#000; }
  label.slider { display:grid; gap:6px; font-size:13px; color:#c9d1dc; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=file] { color:#c9d1dc; font-size:13px; }
  #hideBtn { background:none; border:none; color:#9aa4b2; font-size:13px; cursor:pointer; padding:0; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="pic">
</div>

<div id="ui">
  <div class="panel-head">
    <span>Tracing overlay</span>
    <button id="hideBtn">Hide &#9662;</button>
  </div>
  <div class="panel-body">
    <div class="row">
      <input type="file" id="file" accept="image/*" class="btn">
    </div>
    <div class="row">
      <select id="cams"><option>Starting camera…</option></select>
      <button id="switch" class="btn">Next camera</button>
    </div>
    <label class="slider">Opacity
      <input type="range" id="op" min="0" max="1" step="0.05" value="0.5">
    </label>
    <div class="row">
      <button id="reset" class="btn primary">Reset photo</button>
      <button id="fs" class="btn">Fullscreen</button>
    </div>
  </div>
</div>
<button id="toggle" title="Show controls">&#9652;</button>

<script>
  const $ = id => document.getElementById(id);
  const cam = $('cam'), pic = $('pic'), stage = $('stage'), camSel = $('cams'), op = $('op');
  const ui = $('ui'), toggle = $('toggle');

  // ---- Panel hide / reveal
  const setPanel = shown => {
    ui.classList.toggle('hidden', !shown);
    toggle.classList.toggle('show', !shown);
  };
  $('hideBtn').onclick = () => setPanel(false);
  toggle.onclick = () => setPanel(true);

  // ---- Fullscreen (must be triggered by a tap)
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const updateFsLabel = () => { $('fs').textContent = fsEl() ? 'Exit fullscreen' : 'Fullscreen'; };
  $('fs').onclick = () => {
    if (!fsEl()) {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el).catch(() => {});
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document).catch(() => {});
    }
  };
  document.addEventListener('fullscreenchange', updateFsLabel);
  document.addEventListener('webkitfullscreenchange', updateFsLabel);

  // ---- Photo transform (only the photo is transformed; the camera never is)
  let x = 0, y = 0, scale = 1, angle = 0;
  const render = () => {
    pic.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale})`;
  };

  // ---- Cameras
  let stream = null, devices = [], devIndex = 0;

  async function loadDevices() {
    const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    // Hide front-facing cameras (labels usually contain "front" or "user" once permission is granted)
    devices = all.filter(d => !/front|user|selfie|facing front/i.test(d.label));
    if (devices.length === 0) devices = all;

    const activeId = stream ? stream.getVideoTracks()[0].getSettings().deviceId : null;
    camSel.innerHTML = '';
    devices.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || `Camera ${i + 1}`;
      camSel.appendChild(o);
    });
    devIndex = Math.max(0, devices.findIndex(d => d.deviceId === activeId));
    camSel.value = devices[devIndex]?.deviceId ?? '';
    $('switch').textContent = `Next camera (${devices.length})`;
  }

  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    const video = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video });
      cam.srcObject = stream;
      await loadDevices();
    } catch (err) {
      alert('Camera error: ' + err);
    }
  }

  camSel.onchange = () => startCamera(camSel.value);
  $('switch').onclick = () => {
    if (devices.length < 2) return;
    devIndex = (devIndex + 1) % devices.length;
    startCamera(devices[devIndex].deviceId);
  };
  startCamera(null);

  // ---- Load photo
  $('file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    pic.onload = () => {
      x = y = angle = 0;
      scale = Math.min(innerWidth / pic.naturalWidth, innerHeight / pic.naturalHeight) * 0.8;
      pic.style.display = 'block';
      render();
    };
    pic.src = URL.createObjectURL(f);
  };

  op.oninput = () => pic.style.opacity = op.value;
  $('reset').onclick = () => {
    x = y = angle = 0; scale = 1; render();
    op.value = 0.5; pic.style.opacity = 0.5;
  };

  // ---- Gestures on the stage only
  // Touch: one finger drags, two fingers pinch and twist.
  // Mouse: drag moves, scroll zooms, shift-drag rotates.
  const pts = new Map();
  let prev = null;
  const gesture = () => {
    const [a, b] = [...pts.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x) };
  };

  stage.onpointerdown = e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    if (pts.size === 2) prev = gesture();
  };
  stage.onpointermove = e => {
    if (!pts.has(e.pointerId)) return;
    const old = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pic.style.display !== 'block') return;
    if (pts.size === 1) {
      if (e.shiftKey) angle += (e.clientX - old.x) * 0.5;
      else { x += e.clientX - old.x; y += e.clientY - old.y; }
    } else if (pts.size === 2) {
      const g = gesture();
      scale *= g.d / prev.d;
      angle += (g.ang - prev.ang) * 180 / Math.PI;
      prev = g;
    }
    render();
  };
  const endPointer = e => {
    pts.delete(e.pointerId);
    if (pts.size === 2) prev = gesture();
  };
  stage.onpointerup = endPointer;
  stage.onpointercancel = endPointer;

  stage.addEventListener('wheel', e => {
    if (pic.style.display !== 'block') return;
    scale *= e.deltaY < 0 ? 1.05 : 0.95;
    render();
  }, { passive: true });
</script>
</body>
</html>
