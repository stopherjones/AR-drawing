<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #pic { position:absolute; left:50%; top:50%; max-width:none; opacity:0.5; display:none;
         transform-origin:center center; pointer-events:none; }
  #ui { position:fixed; bottom:0; left:0; right:0; padding:10px; background:rgba(0,0,0,0.75);
        color:#fff; font:14px sans-serif; display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:2; }
  #ui select, #ui button, #ui input[type=file] { font:14px sans-serif; padding:4px 8px; }
  #ui input[type=range] { flex:1; min-width:100px; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="pic">
</div>
<div id="ui">
  <input type="file" id="file" accept="image/*">
  <select id="cams"><option>Starting camera…</option></select>
  <button id="switch">Next camera</button>
  <label>Opacity <input type="range" id="op" min="0" max="1" step="0.05" value="0.5"></label>
  <button id="reset">Reset</button>
</div>
<script>
  const $ = id => document.getElementById(id);
  const cam = $('cam'), pic = $('pic'), stage = $('stage'), camSel = $('cams'), op = $('op');

  // ---- Photo transform (only the photo is ever transformed; the camera never is)
  let x = 0, y = 0, scale = 1, angle = 0;
  const render = () => {
    pic.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale})`;
  };

  // ---- Cameras
  let stream = null, devices = [], devIndex = 0;

  async function loadDevices() {
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const activeId = stream ? stream.getVideoTracks()[0].getSettings().deviceId : null;
    camSel.innerHTML = '';
    devices.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || `Camera ${i + 1}`;
      camSel.appendChild(o);
    });
    devIndex = Math.max(0, devices.findIndex(d => d.deviceId === activeId));
    camSel.value = devices[devIndex]?.deviceId ?? '';
    $('switch').textContent = `Next camera (${devices.length})`;
  }

  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    const video = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video });
      cam.srcObject = stream;
      await loadDevices();
    } catch (err) {
      alert('Camera error: ' + err);
    }
  }

  camSel.onchange = () => startCamera(camSel.value);
  $('switch').onclick = () => {
    if (devices.length < 2) return;
    devIndex = (devIndex + 1) % devices.length;
    startCamera(devices[devIndex].deviceId);
  };
  startCamera(null);

  // ---- Load photo
  $('file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    pic.onload = () => {
      x = y = angle = 0;
      scale = Math.min(innerWidth / pic.naturalWidth, innerHeight / pic.naturalHeight) * 0.8;
      pic.style.display = 'block';
      render();
    };
    pic.src = URL.createObjectURL(f);
  };

  op.oninput = () => pic.style.opacity = op.value;
  $('reset').onclick = () => {
    x = y = angle = 0; scale = 1; render();
    op.value = 0.5; pic.style.opacity = 0.5;
  };

  // ---- Gestures, attached only to the stage (not the controls bar)
  // Touch: one finger drags, two fingers pinch and twist.
  // Mouse: drag moves, scroll zooms, shift-drag rotates.
  const pts = new Map();
  let prev = null;
  const gesture = () => {
    const [a, b] = [...pts.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x) };
  };

  stage.onpointerdown = e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    if (pts.size === 2) prev = gesture();
  };
  stage.onpointermove = e => {
    if (!pts.has(e.pointerId)) return;
    const old = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pic.style.display !== 'block') return;
    if (pts.size === 1) {
      if (e.shiftKey) angle += (e.clientX - old.x) * 0.5;
      else { x += e.clientX - old.x; y += e.clientY - old.y; }
    } else if (pts.size === 2) {
      const g = gesture();
      scale *= g.d / prev.d;
      angle += (g.ang - prev.ang) * 180 / Math.PI;
      prev = g;
    }
    render();
  };
  const endPointer = e => {
    pts.delete(e.pointerId);
    if (pts.size === 2) prev = gesture();
  };
  stage.onpointerup = endPointer;
  stage.onpointercancel = endPointer;

  stage.addEventListener('wheel', e => {
    if (pic.style.display !== 'block') return;
    scale *= e.deltaY < 0 ? 1.05 : 0.95;
    render();
  }, { passive: true });
</script>
</body>
</html>
