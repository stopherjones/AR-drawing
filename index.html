<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  video, img { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:contain; }
  img { opacity:0.5; pointer-events:none; }
  #ui { position:fixed; bottom:0; left:0; right:0; padding:12px; background:rgba(0,0,0,0.6);
        color:#fff; font:16px sans-serif; display:flex; gap:10px; align-items:center; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<img id="pic">
<div id="ui">
  <input type="file" id="file" accept="image/*">
  <input type="range" id="op" min="0" max="1" step="0.05" value="0.5">
</div>
<script>
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => cam.srcObject = stream)
    .catch(err => alert("Camera error: " + err));

  file.onchange = e => pic.src = URL.createObjectURL(e.target.files[0]);
  op.oninput = () => pic.style.opacity = op.value;
</script>
</body>
</html>
